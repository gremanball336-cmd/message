<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>message board</title>
</head>
<body>
    <h2>leave a message</h2>
    
    <div>
        <input type="text" id="nameInput" placeholder="your name"><br>
        <textarea id="msgInput" rows="3" cols="30" placeholder="your message..."></textarea><br>
        <button onclick="postMessage()">post</button>
    </div>
    
    <hr>
    <div id="messageList">loading...</div>

    <script src="https://cdn.jsdelivr.net/npm/ipfs-http-client@50.1.2/dist/index.min.js"></script>
    <script>
        const ipfs = IpfsHttpClient('https://ipfs.infura.io:5001');
        let currentCid = localStorage.getItem('lastCid') || null;
        
        async function loadMessages() {
            if (!currentCid) {
                document.getElementById('messageList').innerHTML = '— no messages yet —';
                return;
            }
            
            try {
                const chunks = [];
                for await (const chunk of ipfs.cat(currentCid)) {
                    chunks.push(chunk);
                }
                const data = JSON.parse(new TextDecoder().decode(chunks[0]));
                displayMessages(data.messages || []);
            } catch (e) {
                document.getElementById('messageList').innerHTML = '— no messages yet —';
            }
        }
        
        async function postMessage() {
            const name = document.getElementById('nameInput').value.trim();
            const text = document.getElementById('msgInput').value.trim();
            if (!name || !text) return;
            
            let messages = [];
            if (currentCid) {
                try {
                    const chunks = [];
                    for await (const chunk of ipfs.cat(currentCid)) {
                        chunks.push(chunk);
                    }
                    messages = JSON.parse(new TextDecoder().decode(chunks[0])).messages || [];
                } catch (e) {}
            }
            
            const now = Date.now();
            messages.push({ name, text, timestamp: now });
            messages = messages.filter(m => now - m.timestamp < 300000);
            
            const { cid } = await ipfs.add(JSON.stringify({ messages }));
            currentCid = cid.toString();
            
            localStorage.setItem('lastCid', currentCid);
            window.location.hash = currentCid;
            loadMessages();
            
            document.getElementById('nameInput').value = '';
            document.getElementById('msgInput').value = '';
        }
        
        function displayMessages(messages) {
            const html = messages.length ? messages.reverse().map(m => 
                `<div style="border:1px solid #ccc; padding:8px; margin:5px 0;">
                    <strong>${escapeHtml(m.name)}:</strong> ${escapeHtml(m.text)}
                </div>`
            ).join('') : '— no messages yet —';
            
            document.getElementById('messageList').innerHTML = html;
        }
        
        function escapeHtml(unsafe) {
            return unsafe.replace(/[&<>"]/g, function(m) {
                if(m === '&') return '&amp;'; if(m === '<') return '&lt;';
                if(m === '>') return '&gt;'; if(m === '"') return '&quot;';
                return m;
            });
        }
        
        if (window.location.hash) {
            currentCid = window.location.hash.substring(1);
            localStorage.setItem('lastCid', currentCid);
        } else if (currentCid) {
            window.location.hash = currentCid;
        }
        
        loadMessages();
        setInterval(loadMessages, 5000);
    </script>
</body>
</html>

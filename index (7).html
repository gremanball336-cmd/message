<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>message board</title>
</head>
<body>
    <h2>leave a message</h2>
    
    <div>
        <input type="text" id="nameInput" placeholder="your name" style="width:200px; margin-bottom:5px;"><br>
        <textarea id="msgInput" rows="3" cols="30" placeholder="your message..."></textarea><br>
        <button onclick="postMsg()">post message</button>
        <button onclick="clearAll()">clear all</button>
    </div>
    
    <hr>
    <h3>recent messages</h3>
    <div id="msgList"></div>

    <script>
        let messages = [];

        // 加载留言
        function loadMessages() {
            try {
                let saved = localStorage.getItem('gb_msg');
                messages = saved ? JSON.parse(saved) : [];
            } catch(e) {
                messages = [];
            }
            showMessages();
        }

        // 保存留言
        function saveMessages() {
            try {
                localStorage.setItem('gb_msg', JSON.stringify(messages));
                return true;
            } catch(e) {
                alert('Safari隐私模式无法保存，请关闭隐私浏览');
                return false;
            }
        }

        // 显示留言
        function showMessages() {
            let listDiv = document.getElementById('msgList');
            if (messages.length === 0) {
                listDiv.innerHTML = '<div>— no messages yet —</div>';
                return;
            }
            
            let html = '';
            for (let i = messages.length - 1; i >= 0; i--) {
                let m = messages[i];
                html += '<div style="border:1px solid #ccc; padding:8px; margin:5px 0;">' +
                       '<strong>' + (m.name || 'anonymous') + ':</strong> ' +
                       '<span>' + (m.text || '') + '</span>' +
                       '</div>';
            }
            listDiv.innerHTML = html;
        }

        // 发布留言
        function postMsg() {
            let name = document.getElementById('nameInput').value.trim();
            let text = document.getElementById('msgInput').value.trim();
            
            if (!name || !text) {
                alert('name and message are required');
                return;
            }
            
            messages.push({name: name, text: text});
            
            if (saveMessages()) {
                showMessages();
                document.getElementById('nameInput').value = '';
                document.getElementById('msgInput').value = '';
            }
        }

        // 清空所有
        function clearAll() {
            if (confirm('delete all messages?')) {
                messages = [];
                saveMessages();
                showMessages();
            }
        }

        // 启动
        loadMessages();
    </script>
</body>
</html>
